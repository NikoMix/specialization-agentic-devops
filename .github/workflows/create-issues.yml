name: Create Audit Engagement Issues

# Opens the full issue set for an audit cycle: the pre-qualification gate, one
# issue per Module A and Module B control, and one issue per Module B evidence
# item. The set is derived from content/docs/ so it always matches the published
# audit guide, and re-runs skip anything that already exists.

on:
  workflow_dispatch:
    inputs:
      year:
        description: "Audit cycle year (blank = current year)"
        required: false
        type: string
      scope:
        description: "Which issues to create"
        required: true
        default: all
        type: choice
        options:
          - all
          - pre-qualification
          - module-a
          - module-b
      dry_run:
        description: "List the issues without creating them"
        required: false
        default: false
        type: boolean
  schedule:
    # 09:00 UTC on 1 March — start of the annual audit cycle.
    - cron: "0 9 1 3 *"

permissions:
  issues: write
  contents: read

jobs:
  create-issues:
    name: Create issues
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create audit issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_YEAR: ${{ inputs.year }}
          INPUT_SCOPE: ${{ inputs.scope || 'all' }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          args=(--repo "$GITHUB_REPOSITORY" --scope "$INPUT_SCOPE")
          if [ -n "${INPUT_YEAR:-}" ]; then
            args+=(--year "$INPUT_YEAR")
          fi
          if [ "${INPUT_DRY_RUN:-false}" = "true" ]; then
            args+=(--dry-run)
          fi
          python .github/scripts/create_audit_issues.py "${args[@]}"
